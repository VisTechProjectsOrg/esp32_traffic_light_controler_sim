# .github/workflows/update-readme-and-release.yml
name: Update README and Release

on:
  push:
    paths:
      - version.json

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read version numbers from version.json
        id: versions
        run: |
          echo "FIRMWARE_VERSION=$(jq -r .firmware version.json)" >> $GITHUB_ENV
          echo "SPIFFS_VERSION=$(jq -r .spiffs version.json)" >> $GITHUB_ENV
          echo "VERSION=v$(jq -r .firmware version.json)" >> $GITHUB_ENV

      - name: Update README.md with version info
        run: node scripts/updateReadme.js

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📄 Update README with version $VERSION" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Firmware Release ${{ env.VERSION }}"
          tag_name: "${{ env.VERSION }}"
          files: |
            firmware.bin
            spiffs.bin
