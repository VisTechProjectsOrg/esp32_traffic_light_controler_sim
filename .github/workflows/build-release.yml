name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: powershell
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update version.h
        shell: powershell
        run: |
          $content = @"
          #define VERSION_FIRMWARE "${{ steps.version.outputs.version }}"
          #define VERSION_SPIFFS "${{ steps.version.outputs.version }}"
          "@
          Set-Content -Path "src/version.h" -Value $content
          Get-Content "src/version.h"

      - name: Build Firmware
        shell: powershell
        run: |
          & "C:/Python314/Scripts/pio.exe" run -e esp32dev

      - name: Build SPIFFS
        shell: powershell
        run: |
          & "C:/Python314/Scripts/pio.exe" run -t buildfs -e esp32dev

      - name: Create combined binary
        shell: powershell
        run: |
          & "C:/Python314/Scripts/esptool.exe" --chip esp32 merge_bin `
            -o "combined_v${{ steps.version.outputs.version }}.bin" `
            --flash_mode dio `
            --flash_freq 40m `
            --flash_size 4MB `
            0x1000 .pio/build/esp32dev/bootloader.bin `
            0x8000 .pio/build/esp32dev/partitions.bin `
            0x10000 .pio/build/esp32dev/firmware.bin `
            0x290000 .pio/build/esp32dev/spiffs.bin

      - name: Rename binaries
        shell: powershell
        run: |
          Copy-Item ".pio/build/esp32dev/firmware.bin" "firmware_v${{ steps.version.outputs.version }}.bin"
          Copy-Item ".pio/build/esp32dev/spiffs.bin" "spiffs_v${{ steps.version.outputs.version }}.bin"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            firmware_v${{ steps.version.outputs.version }}.bin
            spiffs_v${{ steps.version.outputs.version }}.bin
            combined_v${{ steps.version.outputs.version }}.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update firmware_prod branch
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin firmware_prod:firmware_prod 2>$null || git checkout --orphan firmware_prod
          git checkout firmware_prod
          New-Item -ItemType Directory -Force -Path "build"
          Copy-Item ".pio/build/esp32dev/firmware.bin" "build/firmware.bin"
          Copy-Item ".pio/build/esp32dev/spiffs.bin" "build/spiffs.bin"
          $json = @{ firmware = "${{ steps.version.outputs.version }}"; spiffs = "${{ steps.version.outputs.version }}" } | ConvertTo-Json
          Set-Content -Path "version.json" -Value $json
          git add build/firmware.bin build/spiffs.bin version.json
          git commit -m "Update firmware to v${{ steps.version.outputs.version }}"
          git push origin firmware_prod
