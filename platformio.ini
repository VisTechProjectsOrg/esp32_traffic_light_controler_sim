[platformio]
; Upload the staged copy, not data/ - tools/build_spiffs.py gzips the text assets there
; and ESPAsyncWebServer serves the .gz siblings transparently. Sources stay editable in
; data/. Run bump_spiffs_version.py then build_spiffs.py before `pio run -t uploadfs`.
data_dir = data_build

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
board_build.filesystem = spiffs


board_build.partitions = partitions.csv

lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/Links2004/arduinoWebSockets.git
    bblanchon/ArduinoJson@^7.3.0
    budryerson/TFMPlus
    fastled/FastLED@^3.6.1