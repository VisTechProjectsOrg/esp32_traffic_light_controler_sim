<!-- OTA GitHub Updater: index_firmware_update.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>OTA Firmware Update</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style_firmware_update.css">
  <script src="script_firmware_update.js"></script>
  <link rel="icon" href="data:,">
</head>

<body>

  <div class="container">
    <h2>OTA Firmware Update</h2>

    <p id="versionInfo">Checking version...</p>

    <div class="upload-area" id="drop-area">
      <label for="file_input">
        <p>
          Drag & drop <strong><code>FIRMWARE.bin</code></strong> OR <strong><code>SPIFFS.bin</code></strong> file
          here<br />
          or <strong>click to browse</strong>
        </p>
      </label>
    </div>
    <input type="file" id="file_input" accept=".bin" />


    <div class="progress-container" id="progress_container">
      <div class="progress-bar" id="progress_bar"></div>
    </div>

    <div id="status">Awaiting file...</div>

    <br>

    <button id="githubSPIFFS">Can't fetch SPIFFS</button>
    <button id="githubFirmware">Can't fetch Firmware</button>

  </div>

  <div id="successModal">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <h3>✅ Update Successful</h3>
      <p>Your device is now rebooting.</p>
      <button onclick="closeModal()">OK</button>
    </div>
  </div>
</body>

</html>
