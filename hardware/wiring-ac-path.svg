<svg xmlns="http://www.w3.org/2000/svg" font-family="Overpass, Helvetica Neue, Arial, sans-serif" viewBox="0 0 820 588" role="img" aria-label="Mains enters through a 2 amp fuse to the hot bus, which feeds all seven SSR channel inputs and the 5 volt block. Board 1 switches the three vehicle lamps, board 2 switches the two pedestrian hots and the two countdown hots. Each channel output lands on its own island of an uncombed strip, then runs to its lamp. All lamp neutrals return to a commoned neutral bus.">
  <rect x="0" y="0" width="820" height="588" fill="#f6f5f1"/>
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <polygon points="0,1 10,5 0,9" fill="#16191d"/>
        </marker>
        <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <polygon points="0,1 10,5 0,9" fill="#c62828"/>
        </marker>
        <marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <polygon points="0,1 10,5 0,9" fill="#7b848d"/>
        </marker>
      </defs>

      <rect x="40" y="26" width="140" height="52" rx="6" fill="#efede7" stroke="#16191d" stroke-width="1.2"/>
      <text x="110" y="48" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16191d">120 VAC IN</text>
      <text x="110" y="66" text-anchor="middle" font-size="11" fill="#5c656e">L / N / G</text>

      <line x1="180" y1="44" x2="222" y2="44" stroke="#c62828" stroke-width="2.4"/>
      <rect x="222" y="30" width="80" height="28" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
      <text x="262" y="49" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c62828">FUSE 2A</text>
      <line x1="302" y1="44" x2="360" y2="44" stroke="#c62828" stroke-width="2.4"/>
      <line x1="360" y1="44" x2="360" y2="92" stroke="#c62828" stroke-width="2.4" marker-end="url(#arh)"/>

      <rect x="40" y="98" width="740" height="34" rx="5" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
      <text x="56" y="120" font-size="12.5" font-weight="700" fill="#c62828">TB1 HOT BUS</text>
      <text x="764" y="120" text-anchor="end" font-size="11" fill="#5c656e">combed, all 16 screws one node</text>

      <line x1="140" y1="132" x2="140" y2="176" stroke="#c62828" stroke-width="1.8" marker-end="url(#arh)"/>
      <line x1="420" y1="132" x2="420" y2="176" stroke="#c62828" stroke-width="1.8" marker-end="url(#arh)"/>
      <line x1="730" y1="132" x2="730" y2="190" stroke="#c62828" stroke-width="1.8" marker-end="url(#arh)"/>
      <rect x="40" y="182" width="250" height="108" rx="6" fill="#ffffff" stroke="#16191d" stroke-width="1.4"/>
      <text x="56" y="203" font-size="12.5" font-weight="700" fill="#16191d">SSR BOARD 1</text>
      <line x1="56" y1="211" x2="274" y2="211" stroke="#d7d3cb" stroke-width="1"/>
      <rect x="56" y="222" width="7" height="7" rx="1.5" fill="#c62828"/>
      <text x="70" y="229" font-size="11" fill="#5c656e">ch1</text>
      <text x="100" y="229" font-size="11" fill="#16191d">vehicle red</text>
      <text x="274" y="229" text-anchor="end" font-size="11" font-family="Overpass Mono, monospace" fill="#5c656e">GPIO 21</text>
      <rect x="56" y="240" width="7" height="7" rx="1.5" fill="#b45309"/>
      <text x="70" y="247" font-size="11" fill="#5c656e">ch2</text>
      <text x="100" y="247" font-size="11" fill="#16191d">vehicle yellow</text>
      <text x="274" y="247" text-anchor="end" font-size="11" font-family="Overpass Mono, monospace" fill="#5c656e">GPIO 22</text>
      <rect x="56" y="258" width="7" height="7" rx="1.5" fill="#2e7d32"/>
      <text x="70" y="265" font-size="11" fill="#5c656e">ch3</text>
      <text x="100" y="265" font-size="11" fill="#16191d">vehicle green</text>
      <text x="274" y="265" text-anchor="end" font-size="11" font-family="Overpass Mono, monospace" fill="#5c656e">GPIO 23</text>
      <rect x="56" y="276" width="7" height="7" rx="1.5" fill="#5c656e"/>
      <text x="70" y="283" font-size="11" fill="#5c656e">ch4</text>
      <text x="100" y="283" font-size="11" fill="#16191d">spare</text>
      <text x="274" y="283" text-anchor="end" font-size="11" font-family="Overpass Mono, monospace" fill="#5c656e">GPIO -</text>
      <rect x="320" y="182" width="330" height="108" rx="6" fill="#ffffff" stroke="#16191d" stroke-width="1.4"/>
      <text x="336" y="203" font-size="12.5" font-weight="700" fill="#16191d">SSR BOARD 2</text>
      <line x1="336" y1="211" x2="634" y2="211" stroke="#d7d3cb" stroke-width="1"/>
      <rect x="336" y="222" width="7" height="7" rx="1.5" fill="#d84a00"/>
      <text x="350" y="229" font-size="11" fill="#5c656e">ch1</text>
      <text x="380" y="229" font-size="11" fill="#16191d">ped DON'T WALK</text>
      <text x="634" y="229" text-anchor="end" font-size="11" font-family="Overpass Mono, monospace" fill="#5c656e">GPIO 32</text>
      <rect x="336" y="240" width="7" height="7" rx="1.5" fill="#1565c0"/>
      <text x="350" y="247" font-size="11" fill="#5c656e">ch2</text>
      <text x="380" y="247" font-size="11" fill="#16191d">ped WALK</text>
      <text x="634" y="247" text-anchor="end" font-size="11" font-family="Overpass Mono, monospace" fill="#5c656e">GPIO 33</text>
      <rect x="336" y="258" width="7" height="7" rx="1.5" fill="#d84a00"/>
      <text x="350" y="265" font-size="11" fill="#5c656e">ch3</text>
      <text x="380" y="265" font-size="11" fill="#16191d">countdown DON'T WALK</text>
      <text x="634" y="265" text-anchor="end" font-size="11" font-family="Overpass Mono, monospace" fill="#5c656e">GPIO 18</text>
      <rect x="336" y="276" width="7" height="7" rx="1.5" fill="#1565c0"/>
      <text x="350" y="283" font-size="11" fill="#5c656e">ch4</text>
      <text x="380" y="283" font-size="11" fill="#16191d">countdown WALK</text>
      <text x="634" y="283" text-anchor="end" font-size="11" font-family="Overpass Mono, monospace" fill="#5c656e">GPIO 19</text>

      <rect x="686" y="196" width="94" height="44" rx="5" fill="#efede7" stroke="#16191d" stroke-width="1.2"/>
      <text x="733" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16191d">5 V BLOCK</text>
      <text x="733" y="231" text-anchor="middle" font-size="10.5" fill="#5c656e">see below</text>

      <line x1="140" y1="290" x2="140" y2="336" stroke="#16191d" stroke-width="1.6" marker-end="url(#ar)"/>
      <line x1="420" y1="290" x2="420" y2="336" stroke="#16191d" stroke-width="1.6" marker-end="url(#ar)"/>
      <text x="152" y="317" font-size="11" fill="#5c656e">switched hot, one per lamp</text>

      <rect x="40" y="342" width="740" height="38" rx="5" fill="#ffffff" stroke="#16191d" stroke-width="1.6"/>
      <line x1="132" y1="342" x2="132" y2="380" stroke="#d7d3cb" stroke-width="1"/>
      <line x1="224" y1="342" x2="224" y2="380" stroke="#d7d3cb" stroke-width="1"/>
      <line x1="316" y1="342" x2="316" y2="380" stroke="#d7d3cb" stroke-width="1"/>
      <line x1="408" y1="342" x2="408" y2="380" stroke="#d7d3cb" stroke-width="1"/>
      <line x1="500" y1="342" x2="500" y2="380" stroke="#d7d3cb" stroke-width="1"/>
      <line x1="592" y1="342" x2="592" y2="380" stroke="#d7d3cb" stroke-width="1"/>
      <line x1="684" y1="342" x2="684" y2="380" stroke="#d7d3cb" stroke-width="1"/>
      <text x="56" y="366" font-size="12.5" font-weight="700" fill="#16191d">TB4 SWITCHED OUT</text>
      <text x="764" y="366" text-anchor="end" font-size="11" fill="#5c656e">not combed, 8 islands</text>

      <line x1="140" y1="380" x2="140" y2="422" stroke="#c62828" stroke-width="1.6" marker-end="url(#arh)"/>
      <line x1="392" y1="380" x2="392" y2="422" stroke="#d84a00" stroke-width="1.8"/>
      <line x1="440" y1="380" x2="440" y2="422" stroke="#1565c0" stroke-width="1.8"/>
      <line x1="620" y1="380" x2="620" y2="422" stroke="#d84a00" stroke-width="1.8"/>
      <line x1="668" y1="380" x2="668" y2="422" stroke="#1565c0" stroke-width="1.8"/>

      <rect x="40" y="428" width="230" height="56" rx="6" fill="#efede7" stroke="#16191d" stroke-width="1.2"/>
      <text x="56" y="449" font-size="12.5" font-weight="700" fill="#16191d">VEHICLE HEAD</text>
      <text x="56" y="467" font-size="11" fill="#5c656e">red, yellow, green</text>

      <rect x="316" y="428" width="200" height="56" rx="6" fill="#efede7" stroke="#16191d" stroke-width="1.2"/>
      <text x="332" y="449" font-size="12.5" font-weight="700" fill="#16191d">PED COMBO</text>
      <text x="332" y="467" font-size="11" fill="#5c656e">hand, walking person</text>

      <rect x="548" y="428" width="200" height="56" rx="6" fill="#efede7" stroke="#16191d" stroke-width="1.2"/>
      <text x="564" y="449" font-size="12.5" font-weight="700" fill="#16191d">COUNTDOWN</text>
      <text x="564" y="467" font-size="11" fill="#5c656e">2 digit</text>

      <line x1="155" y1="484" x2="155" y2="518" stroke="#7b848d" stroke-width="1.8" marker-end="url(#arn)"/>
      <line x1="416" y1="484" x2="416" y2="518" stroke="#7b848d" stroke-width="1.8" marker-end="url(#arn)"/>
      <line x1="648" y1="484" x2="648" y2="518" stroke="#7b848d" stroke-width="1.8" marker-end="url(#arn)"/>

      <rect x="40" y="522" width="740" height="28" rx="5" fill="#ffffff" stroke="#7b848d" stroke-width="2"/>
      <text x="56" y="541" font-size="12.5" font-weight="700" fill="#7b848d">TB2 NEUTRAL BUS</text>
      <text x="764" y="541" text-anchor="end" font-size="11" fill="#5c656e">from mains N, never switched</text>

      <rect x="40" y="558" width="740" height="26" rx="5" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="56" y="576" font-size="12.5" font-weight="700" fill="#2e7d32">TB3 GROUND BUS</text>
      <text x="764" y="576" text-anchor="end" font-size="11" fill="#5c656e">from mains G only, housings are plastic</text>
    </svg>
