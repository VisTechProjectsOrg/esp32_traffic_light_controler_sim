<svg xmlns="http://www.w3.org/2000/svg" font-family="Overpass, Helvetica Neue, Arial, sans-serif" viewBox="0 0 820 96" role="img" aria-label="A USB charger on the mains strips feeds the ESP32 over its USB cable. The ESP32 five volt pin and ground feed both relay boards through the breadboard. All three share one ground.">
  <rect x="0" y="0" width="820" height="96" fill="#f6f5f1"/>
      <defs>
        <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <polygon points="0,1 10,5 0,9" fill="#16191d"/>
        </marker>
      </defs>

      <text x="20" y="16" font-size="12" font-weight="700" fill="#16191d">5 V DISTRIBUTION</text>
      <rect x="20" y="30" width="150" height="46" rx="5" fill="#efede7" stroke="#16191d" stroke-width="1.2"/>
      <text x="95" y="48" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16191d">USB CHARGER</text>
      <text x="95" y="64" text-anchor="middle" font-size="10.5" fill="#5c656e">from TB1 / TB2</text>

      <line x1="170" y1="53" x2="228" y2="53" stroke="#16191d" stroke-width="1.6" marker-end="url(#ar2)"/>
      <text x="199" y="45" text-anchor="middle" font-size="10" fill="#5c656e">USB</text>

      <rect x="232" y="30" width="120" height="46" rx="5" fill="#ffffff" stroke="#16191d" stroke-width="1.2"/>
      <text x="292" y="49" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16191d">ESP32</text>
      <text x="292" y="65" text-anchor="middle" font-size="10.5" fill="#5c656e">on the breadboard</text>

      <line x1="352" y1="44" x2="410" y2="44" stroke="#c62828" stroke-width="2" marker-end="url(#ar2)"/>
      <line x1="352" y1="62" x2="410" y2="62" stroke="#7b848d" stroke-width="2" marker-end="url(#ar2)"/>
      <text x="381" y="36" text-anchor="middle" font-size="10" fill="#c62828">5V pin</text>
      <text x="381" y="78" text-anchor="middle" font-size="10" fill="#7b848d">GND</text>

      <rect x="414" y="22" width="118" height="30" rx="5" fill="#ffffff" stroke="#16191d" stroke-width="1.2"/>
      <text x="473" y="42" text-anchor="middle" font-size="11.5" fill="#16191d">SSR 1 DC+ / DC-</text>
      <rect x="414" y="58" width="118" height="30" rx="5" fill="#ffffff" stroke="#16191d" stroke-width="1.2"/>
      <text x="473" y="78" text-anchor="middle" font-size="11.5" fill="#16191d">SSR 2 DC+ / DC-</text>

      <path d="M548 37 L560 37 L560 73 L548 73" fill="none" stroke="#b45309" stroke-width="1.8"/>
      <text x="570" y="50" font-size="11.5" font-weight="600" fill="#b45309">grounds must be</text>
      <text x="570" y="66" font-size="11.5" font-weight="600" fill="#b45309">common - or the</text>
      <text x="570" y="82" font-size="11.5" font-weight="600" fill="#b45309">triggers float</text>
    </svg>
